# ==========================================
# Portila Client Configuration
# ==========================================

[client]
server_address = 127.0.0.1:4433
password       = Su233mfqtFltZLMoiySMoRR0jc1eoAaH
client_id      = client_android_2256
auto_reconnect = true

# Operating Mode:
# 'reverse' -> Expose local service to VPS (Rathole / FRP mode)
# 'exit'    -> Mobile/local proxy gateway for remote browsing (Exit Node mode)
mode           = reverse
local_target   = 127.0.0.1:8080

# Upstream DNS (Required on Android CGO_ENABLED=0)
dns_servers    = 1.1.1.1:53, 8.8.8.8:53

# Tunnel & Security
max_incoming_streams = 32
insecure_skip_verify = true

# Multi-port / Multi-service mapping (FRP / Rathole style)
# Maps incoming public VPS port to local destination:
# [client.tunnels]
# 8080 = 127.0.0.1:3000   # e.g. web app
# 2222 = 127.0.0.1:22     # e.g. local SSH

[client.limits]
per_host_concurrency = 3
queue_wait_seconds   = 300
